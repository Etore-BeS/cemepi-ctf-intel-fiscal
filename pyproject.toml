[project]
name = "cemepi-ctf-intel-fiscal"
version = "0.1.0"
description = "CeMEPI CTF monorepo — shared uv env + uniform project layout"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.1.0",
    "bs4>=0.0.2",
    "boto3>=1.42.1",
    "deltalake>=1.5.1",
    "duckdb>=1.5.0",
    "fake-useragent>=2.0.3",
    "ijson>=3.5.0",
    "ipykernel>=7.1.0",
    "juscraper @ git+ssh://git@github.com/Etore-BeS/juscraper.git",
    "matplotlib>=3.10.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "pydantic-ai-slim[anthropic]>=0.2.0",
    "python-bcb>=0.3.6",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.2.1",
    "requests>=2.34.2",
    "scikit-learn>=1.6.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.0",
    "tqdm>=4.67.3",
    "plotly>=7.0.0",
    "networkx>=3.6.1",
    "kaleido>=1.4.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "nbconvert>=7.16.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
    "vl-convert-python>=1.7.0",
]
nlp = [
    "torch>=2.5.0",
    "transformers>=4.48.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "shared/cemepi_api",
  "pipelines/litigancia/src/config",
  "pipelines/litigancia/src/scrapers",
  "pipelines/litigancia/src/utils",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true
override-dependencies = [
    "greenlet>=3.1.1",
]
