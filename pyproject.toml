[project]
name = "cemepi-ctf-intel-fiscal"
version = "0.1.0"
description = "CeMEPI CTF monorepo — shared uv env + uniform project layout"
readme = "README.md"
requires-python = ">=3.13"
# Base enxuta: só o que todas as frentes usam para ler o dump, montar painéis e plotar.
# Pacotes pesados ou com acesso especial (git+ssh, modelos) ficam em grupos (docs/ESTRUTURA.md, decisão D4).
dependencies = [
    "duckdb>=1.5.0",
    "kaleido>=1.4.0",
    "networkx>=3.6.1",
    "numpy>=2.0.0",
    "pandas>=2.2.3",
    "plotly>=7.0.0",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "python-bcb>=0.3.6",
    "python-dateutil>=2.9.0",
    "python-dotenv>=1.2.1",
    "requests>=2.34.2",
    "scikit-learn>=1.6.1",
    "statsmodels>=0.14.0",
    "tqdm>=4.67.3",
]

[project.scripts]
cnpj-pipeline = "cnpj_pipeline.cli:main"      # pipelines/cnpj_enrich (uv run cnpj-pipeline <etapa>)

[dependency-groups]
# uv sync                      → base + dev (padrão)
# uv sync --group litigancia   → + coleta TJSP/lake (precisa de acesso SSH ao repo juscraper)
# uv sync --group forecast     → + modelos de previsão (timesfm)
# uv sync --group lab          → + motor Jupyter mínimo para o Quarto renderizar lab/
# uv sync --group cnpj         → + pipelines/cnpj_enrich (Dados Abertos CNPJ da RFB; pglast só valida a DDL nos testes)
dev = [
    "ipykernel>=7.1.0",
    "nbconvert>=7.16.0",
    "nbstripout>=0.9.1",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "ruff>=0.11.0",
    "vl-convert-python>=1.7.0",
]
litigancia = [
    "altair>=6.1.0",
    "boto3>=1.42.1",
    "bs4>=0.0.2",
    "deltalake>=1.5.1",
    "fake-useragent>=2.0.3",
    "gitpython>=3.1.62",          # sem import encontrado na main em 23/10/2026 — confirmar se ainda é usado
    "ijson>=3.5.0",
    "juscraper @ git+ssh://git@github.com/Etore-BeS/juscraper.git",
    "matplotlib>=3.10.0",
    "openpyxl>=3.1.5",
    "pydantic-ai-slim[anthropic]>=0.2.0",
    "seaborn>=0.13.2",
]
forecast = [
    "huggingface-hub>=1.31.0",
    "timesfm>=3.0.2",
]
nlp = [
    "torch>=2.5.0",
    "transformers>=4.48.0",
]
cnpj = [
    "duckdb>=1.5.0",
    "python-dotenv>=1.2.1",
    "requests>=2.34.2",
    "pglast>=7.0",
]
lab = [
    "ipykernel>=7.1.0",
    "jupyter-core>=5.7",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "shared/cemepi_api",
  "pipelines/litigancia/src/config",
  "pipelines/litigancia/src/scrapers",
  "pipelines/litigancia/src/utils",
  # "pipelines/divida_ativa/src/divida_ativa",   # descomentar no passo 6 do MIGRACAO.md
  "pipelines/cnpj_enrich/src/cnpj_pipeline",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true
default-groups = ["dev"]
override-dependencies = [
    "greenlet>=3.1.1",
]

[tool.pytest.ini_options]
testpaths = ["scripts/tests", "pipelines/litigancia/tests", "pipelines/cnpj_enrich/tests"]
