# Perfil "partes": só para EXECUTAR localmente uma parte do EDA do paper e atualizar o _freeze dela.
# As partes não são páginas do site (ver _quarto.yml); fora do render do projeto, o Quarto as trata como arquivo
# solto e não grava o _freeze. Uso:  quarto render lab/paper_eda/02_parte_a.qmd --profile partes
project:
  render:
    - "paper_eda/0*.qmd"
