<!-- lab: sumário lateral da página única do EDA do paper (incluído só em paper_eda/index.qmd).
     O sumário sai de dentro da coluna do Quarto e fica em position: fixed (nada de sticky, que depende de cada
     ancestral e some quando o Quarto esconde a coluna abaixo de 992 px). Telas >= 992 px: fixo sobre a coluna da
     esquerda, no topo (top 0, altura da tela), com rolagem própria. Telas menores: botão "Sumário" que abre o mesmo sumário
     como painel. A navbar do site não aparece nesta página. Cada tópico com subtópicos tem uma
     setinha que abre/fecha por clique; a seção atual (a.active) abre sozinha os tópicos que a contêm, salvo os
     que você fechou à mão. -->
<style>
/* sem navbar nesta página (pedido do Étore): o sumário é a navegação */
#quarto-header { display: none !important; }
body, body.nav-fixed { padding-top: 0 !important; }
#quarto-content { margin-top: 0 !important; }
#lab-toc-fixo {
  position: fixed !important; z-index: 1020; overflow-y: auto; overscroll-behavior: contain;
  background: var(--bs-body-bg, #fff); padding: .25rem .5rem .75rem 0; margin: 0; box-sizing: border-box;
  height: auto !important; visibility: visible !important;
  /* o quarto-nav.js mexe no top/max-height de todo .sidebar ao esconder a navbar; aqui manda o valor do lab */
  top: var(--lab-top, 0px) !important; max-height: var(--lab-maxh, 100vh) !important;
}
#lab-toc-botao {
  display: none; position: fixed; left: .75rem; bottom: .75rem; z-index: 1031; padding: .4rem .9rem;
  border: 1px solid #dee2e6; border-radius: 2rem; background: var(--bs-body-bg, #fff); color: inherit;
  box-shadow: 0 .25rem .75rem rgba(0, 0, 0, .15); font-size: .9rem; cursor: pointer;
}
@media (max-width: 991.98px) {
  #lab-toc-botao { display: block; }
  #lab-toc-fixo { display: none; left: .5rem !important; width: min(22rem, 88vw) !important; z-index: 1030;
    border: 1px solid #dee2e6; border-radius: .5rem; box-shadow: 0 .5rem 1.5rem rgba(0, 0, 0, .18); padding: .75rem; }
  body.lab-toc-aberto #lab-toc-fixo { display: block; }
}
#TOC li.lab-has-sub { display: grid; grid-template-columns: 1.1em minmax(0, 1fr); align-items: start; }
#TOC li.lab-has-sub > .lab-toc-toggle { grid-column: 1; }
#TOC li.lab-has-sub > a { grid-column: 2; }
#TOC li.lab-has-sub > ul { grid-column: 2; }
#TOC li:not(.lab-has-sub) { margin-left: 1.1em; }
#TOC .lab-toc-toggle {
  border: 0; background: none; padding: 0; margin-top: .2em; cursor: pointer;
  color: var(--bs-secondary-color, #6c757d); font-size: 1rem; line-height: 1; width: 1.1em; text-align: left;
}
#TOC .lab-toc-toggle::before { content: "▸"; }
#TOC li.lab-open > .lab-toc-toggle::before { content: "▾"; }
#TOC .lab-toc-toggle:hover, #TOC .lab-toc-toggle:focus-visible { color: var(--bs-primary, #2780e3); }
#TOC li.lab-closed > ul { display: none !important; }
#TOC li.lab-open > ul { display: block !important; }
#TOC > ul > li > a { font-weight: 600; }
/* figuras na largura do corpo (a coluna é larga só nesta página, via grid no cabeçalho) */
main .cell-output-display { max-width: 100%; }
main .cell-output-display img { max-width: 100%; height: auto; }
main .cell-output-display .plotly-graph-div { width: 100% !important; }
main iframe { width: 100%; }
</style>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var toc = document.querySelector("#TOC");
  if (!toc) return;
  var col = document.querySelector("#quarto-sidebar") || toc.parentElement;   // coluna do Quarto (fica vazia, reserva o espaço)
  var nav = document.querySelector("#quarto-header");
  // o sumário vai para um contêiner próprio, filho direto do <body> (fora de qualquer ancestral com overflow ou
  // transform), com a classe "sidebar" para herdar o visual do Quarto
  var wrap = document.createElement("div");
  wrap.id = "lab-toc-fixo"; wrap.className = "sidebar";
  wrap.appendChild(toc);
  document.body.appendChild(wrap);
  var box = wrap;
  var btn = document.createElement("button");
  btn.id = "lab-toc-botao"; btn.type = "button"; btn.textContent = "☰ Contents";
  btn.addEventListener("click", function () { document.body.classList.toggle("lab-toc-aberto"); place(); });
  document.body.appendChild(btn);
  toc.addEventListener("click", function (e) {    // no modo painel, escolher uma seção fecha o painel
    if (e.target.closest("a") && innerWidth < 992) document.body.classList.remove("lab-toc-aberto");
  });
  function place() {
    var top = (nav && nav.offsetParent !== null) ? Math.max(0, nav.getBoundingClientRect().bottom) : 0;   // sem navbar: 0
    wrap.style.setProperty("--lab-top", top + "px");
    wrap.style.setProperty("--lab-maxh", (innerHeight - top) + "px");
    if (innerWidth >= 992) {
      var r = col.getBoundingClientRect();
      wrap.style.left = Math.max(0, r.left) + "px";
      wrap.style.width = Math.max(180, r.width) + "px";
    } else {
      wrap.style.left = ""; wrap.style.width = "";
    }
  }
  place();
  window.addEventListener("scroll", place, { passive: true });
  window.addEventListener("resize", place);
  window.addEventListener("load", place);
  setTimeout(place, 500);
  var subs = [];
  toc.querySelectorAll("li").forEach(function (li) {
    var ul = li.querySelector(":scope > ul");
    if (!ul) return;
    var b = document.createElement("button");
    b.type = "button";
    b.className = "lab-toc-toggle";
    b.title = "Expand/collapse subsections";
    li.classList.add("lab-has-sub");
    li.insertBefore(b, li.firstChild);
    b.addEventListener("click", function (e) {
      e.preventDefault(); e.stopPropagation();
      li.dataset.labUser = "1";
      setOpen(li, !li.classList.contains("lab-open"));
    });
    subs.push(li);
  });
  function setOpen(li, open) {
    li.classList.toggle("lab-open", open);
    li.classList.toggle("lab-closed", !open);
    li.querySelector(":scope > .lab-toc-toggle").setAttribute("aria-expanded", String(open));
  }
  var last = null;
  function sync() {
    var act = toc.querySelector("a.active");
    subs.forEach(function (li) {
      if (li.dataset.labUser) return;            // clique manual manda
      setOpen(li, !!act && li.contains(act));
    });
    if (act && act !== last && box) {            // mantém a seção atual visível no sumário
      var r = act.getBoundingClientRect(), rb = box.getBoundingClientRect();
      if (r.top < rb.top + 20 || r.bottom > rb.bottom - 20) box.scrollTop += r.top - rb.top - rb.height / 3;
    }
    last = act;
  }
  sync();
  // plotly: redimensiona as figuras para a largura do corpo (e de novo quando a janela muda)
  function fitPlots() {
    if (!window.Plotly) return;
    document.querySelectorAll("main .plotly-graph-div").forEach(function (d) {
      try { window.Plotly.Plots.resize(d); } catch (e) {}
    });
  }
  window.addEventListener("load", function () { setTimeout(fitPlots, 300); });
  var rt; window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(fitPlots, 200); });
  new MutationObserver(sync).observe(toc, { subtree: true, attributes: true, attributeFilter: ["class"] });
});
</script>
