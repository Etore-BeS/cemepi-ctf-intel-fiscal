# Laboratório (EDA vivo) — publicado no GitHub Pages pelo workflow .github/workflows/lab-pages.yml
# Ref.: docs/ESTRUTURA.md §6. Quarto >= 1.10 (testado com 1.10.19 em 23/10/2026).
project:
  type: website
  output-dir: _site
  render:
    # Atenção: um padrão sem "/" (ex.: "*.qmd") casa em qualquer subpasta e trazia de volta as 8 partes do paper.
    - "index.qmd"
    - "paper_eda/index.qmd"   # a página única: o EDA do paper E todas as entradas do lab (seções 1–8, numeração única). As 8 partes
                              # (paper_eda/0*.qmd) e as entradas (eda/*.qmd, dados/*.qmd) NÃO são páginas: o _freeze
                              # delas alimenta esta página (CTF-03, 26/10/2026). Para executar uma delas e atualizar o
                              # _freeze: quarto render <arquivo> --profile partes (ver _quarto-partes.yml)
    - "suplementos/**/*.qmd"
    - "!README.md"          # instruções para quem mantém, não é página do site

lang: en

execute:
  # Executa só localmente (dados no HD). No CI o site é montado a partir de _freeze/.
  # "auto": reexecuta um documento apenas quando a fonte muda. Suplementos usam freeze: true
  # (ver suplementos/_metadata.yml).
  freeze: auto
  echo: false          # código escondido por padrão; use code-fold por página se quiser mostrar
  warning: false

website:
  title: "Lab — São Paulo state enrolled tax debt (CEMEPI / PGE-SP)"
  repo-url: https://github.com/Etore-BeS/cemepi-ctf-intel-fiscal
  repo-subdir: lab
  repo-actions: [source]
  page-navigation: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: paper_eda/index.qmd
        text: Paper EDA (main)
      - text: Article supplements
        href: suplementos/index.qmd
  page-footer:
    left: "Aggregates only. Taxpayer identifiers appear only as salted hashes."
    right: "Source: Inteligência Fiscal dump (PGE-SP), `extracao` stated on each page."

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: false
    embed-resources: false   # não embutir JS: plotly.js vem da CDN (ver _environment)
    df-print: kable
