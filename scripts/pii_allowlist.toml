# Configuração do scripts/pii_check.py
# Caminhos são relativos à raiz do repositório e aceitam glob (fnmatch: * casa também '/').

# Pastas/arquivos que não são varridos (além dos padrões: site_libs, .quarto, imagens, parquet…)
exclude = []

# Colunas que nunca podem aparecer com valor ao lado no material publicado
forbidden_columns = ["NOME_DEVEDOR", "CPF_DEVEDOR", "nome_socio", "cpf_cnpj_socio"]

# E-mails permitidos (domínio inteiro ou endereço exato)
allowed_email_domains = ["example.com", "example.org", "users.noreply.github.com"]
allowed_emails = []

# Exceções por arquivo. Para valores sensíveis, prefira sha256 a 'values'
# (python3 -c "import hashlib;print(hashlib.sha256(b'VALOR').hexdigest())").
#
# [[allow]]
# path   = "lab/eda/2026-10-23_concentracao.qmd"
# rules  = ["cnpj"]            # "cpf" | "cnpj" | "email" | "coluna_proibida" | "*"
# sha256 = ["<hash do valor>"] # opcional; sem values/sha256 = qualquer valor dessa regra no arquivo
# reason = "total em R$ com 14 dígitos que passa no DV (falso positivo)"

[[allow]]
path   = "lab/_site/paper_eda/EDA_paper_CEMEPI.html"
rules  = ["email"]
sha256 = ["2985405b5c11775f658898b6945083c6beaf7a151d0c800006cc68072b8dedb5"]
reason = "e-mail do autor no cabeçalho de licença de uma biblioteca JS embutida (buffer, dentro do plotly.js) no HTML único local; não é dado de pesquisa"
